name: Simple Cache Architecture Test

on:
  workflow_dispatch:

jobs:
  # First run - populate cache with x64 modules
  cache-with-x64:
    name: Cache with x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node with x64
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          architecture: 'x64'
          cache: 'yarn'
      
      - name: Install dependencies
        run: |
          corepack enable
          yarn install
      
      - name: Test modules
        run: node test.js

  # Second run - try to use cache with x86 (32-bit)
  try-cache-with-x86:
    name: Try cache with x86
    runs-on: ubuntu-latest
    needs: cache-with-x64
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node with x86
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          architecture: 'x86'  # Different architecture!
          cache: 'yarn'
      
      - name: Show the problem
        run: |
          echo "This job specified architecture: x86"
          echo "But it will restore the cache from x64 job!"
          echo "Both jobs use the same cache key because it's based on host arch (x64)"
      
      - name: Install dependencies
        run: |
          corepack enable
          npm_config_arch=ia32 yarn install
        continue-on-error: true
      
      - name: Test modules (will likely fail)
        run: node test.js
        continue-on-error: true
